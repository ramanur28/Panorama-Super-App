# =========================================================================
# PANORAMA SUPER APP - LOCAL BUILD & TESTING DOCKER COMPOSE
# =========================================================================

services:
  db:
    image: mysql:8.0
    container_name: panorama_local_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-panorama_root_secret_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-panorama_tour_db}
      MYSQL_USER: ${MYSQL_USER:-panorama_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-panorama_user_pass_2026}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - panorama_local_mysql_data:/var/lib/mysql
      - ./database/schema.mysql.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "3307:3306"
    networks:
      - panorama_local_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-panorama_root_secret_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${DOCKER_REGISTRY:-docker.io}/${REGISTRY_USER:-retdev}/panorama-backend:${IMAGE_TAG:-latest}
    container_name: panorama_local_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-panorama_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-panorama_user_pass_2026}
      DB_NAME: ${MYSQL_DATABASE:-panorama_tour_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - panorama_local_net
    ports:
      - "127.0.0.1:4000:4000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ${DOCKER_REGISTRY:-docker.io}/${REGISTRY_USER:-retdev}/panorama-frontend:${IMAGE_TAG:-latest}
    container_name: panorama_local_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - panorama_local_net

networks:
  panorama_local_net:
    driver: bridge

volumes:
  panorama_local_mysql_data:
