# =========================================================================
# PANORAMA SUPER APP - PRODUCTION DOCKER COMPOSE CONFIGURATION
# Disesuaikan untuk server VPS dengan reverse proxy Caddy yang sudah berjalan
# =========================================================================

services:
  # -----------------------------------------------------------------------
  # 1. DATABASE: MySQL 8.0 with automated initial schema seeding
  # -----------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: panorama_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-panorama_root_secret_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-panorama_tour_db}
      MYSQL_USER: ${MYSQL_USER:-panorama_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-panorama_user_pass_2026}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - panorama_mysql_data:/var/lib/mysql
      - ./database/schema.mysql.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - panorama_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-panorama_root_secret_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -----------------------------------------------------------------------
  # 2. BACKEND: Node.js Centralized REST API
  # Dibind ke 127.0.0.1:4000 agar reverse proxy Caddy dapat mengakses /api/*
  # -----------------------------------------------------------------------
  backend:
    image: ${DOCKER_REGISTRY:-docker.io}/${REGISTRY_USER:-retdev}/panorama-backend:${IMAGE_TAG:-latest}
    container_name: panorama_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-panorama_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-panorama_user_pass_2026}
      DB_NAME: ${MYSQL_DATABASE:-panorama_tour_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - panorama_network
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  # -----------------------------------------------------------------------
  # 3. FRONTEND: React SPA Web
  # Di-proxy oleh Caddy container via host.docker.internal:3005
  # -----------------------------------------------------------------------
  frontend:
    image: ${DOCKER_REGISTRY:-docker.io}/${REGISTRY_USER:-retdev}/panorama-frontend:${IMAGE_TAG:-latest}
    container_name: panorama_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3005}:80"
    depends_on:
      - backend
    networks:
      - panorama_network

# -------------------------------------------------------------------------
# NETWORKS & VOLUMES
# -------------------------------------------------------------------------
networks:
  panorama_network:
    name: panorama_network
    driver: bridge

volumes:
  panorama_mysql_data:
    name: panorama_mysql_data
